  <path d="M0 360 C 250 320, 500 410, 800 370 C 1100 330, 1350 420, 1600 360 L 1600 500 L 0 500 Z" fill="url(#wave)" />
  <path d="M0 420 C 300 390, 600 450, 900 420 C 1200 390, 1450 460, 1600 430 L 1600 500 L 0 500 Z" fill="rgba(255,255,255,0.05)" />
