<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c3f" />
      <stop offset="45%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(96,165,250,0.35)" />
      <stop offset="100%" stop-color="rgba(96,165,250,0)" />
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(103,232,249,0.25)" />
      <stop offset="100%" stop-color="rgba(103,232,249,0)" />
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)" />

  <circle cx="1250" cy="120" r="300" fill="url(#glow1)" />
  <circle cx="250" cy="400" r="220" fill="url(#glow2)" />
  <circle cx="800" cy="250" r="400" fill="url(#glow1)" opacity="0.4" />

  <g stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none" stroke-linecap="round">
    <line x1="60" y1="120" x2="260" y2="160" />
    <line x1="260" y1="160" x2="460" y2="110" />
    <line x1="260" y1="160" x2="440" y2="240" />
    <line x1="460" y1="110" x2="600" y2="80" />
    <line x1="460" y1="110" x2="640" y2="200" />
    <line x1="640" y1="200" x2="840" y2="160" />
    <line x1="600" y1="80" x2="820" y2="100" />
    <line x1="840" y1="160" x2="1020" y2="210" />
    <line x1="820" y1="100" x2="1000" y2="130" />
